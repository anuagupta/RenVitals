<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitals — Dashboard</title>
<meta name="description" content="A read-only view of Vitals health data. Nothing on this page can be edited.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Same stylesheet the app itself uses — every class below (.card, .tabbar,
     .detail, .dose-row, …) is already styled there, so this page renders
     pixel-for-pixel like the app's own screens, light/dark theme included. -->
<link rel="stylesheet" href="styles.css">
<style>
  /* The one thing this page needs that the app doesn't. */
  .readonly-badge{
    font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--text-dim);
    align-self:center;
  }
  #dash-status.err{color:var(--danger);}
</style>
</head>
<body>

<div class="phone">

  <!-- ============ HEADER ============ -->
  <div class="app-header">
    <div class="header-row">
      <div>
        <p class="greeting">Vitals</p>
        <p class="date" id="dash-status">Loading…</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="readonly-badge">Read only</span>
        <button class="theme-toggle" id="refresh-btn" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4M21 12a9 9 0 0 1-15.3 6.4"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main>
    <!-- ============ HOME PANEL — tap any card to see its full detail ============ -->
    <section class="panel active" id="panel-home">
      <div class="grid" id="home-grid"><!-- cards rendered by dashboard.js --></div>
    </section>

    <!-- ============ TRENDS PANEL ============ -->
    <section class="panel" id="panel-trends">
      <div class="section-title" style="margin-top:4px;">
        Trends
        <span class="link" id="trend-range-toggle">Last 7 days</span>
      </div>
      <div id="trend-cards"><!-- rendered by dashboard.js --></div>
    </section>

    <!-- ============ MEDICINES PANEL ============ -->
    <section class="panel" id="panel-medicines">
      <div class="section-title" style="margin-top:4px;">Today</div>
      <div class="trend-card glass-card" id="medicines-today-list" style="padding:4px 16px;">
        <p class="empty-hint">No medicines scheduled for today.</p>
      </div>

      <div class="section-title">
        <button class="collapsible-toggle-inline" id="medicines-list-toggle" aria-expanded="false" aria-controls="medicines-list" type="button">
          All medicines
          <svg class="chevron" id="medicines-list-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="trend-card glass-card collapsed" id="medicines-list" style="padding:4px 16px;">
        <p class="empty-hint">No medicines yet.</p>
      </div>
    </section>
  </main>

  <!-- ============ TAB BAR ============ -->
  <div class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Vitals
      </button>
      <button class="tab" data-tab="trends">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
        Trends
      </button>
      <button class="tab" data-tab="medicines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9.5" width="16" height="7" rx="3.5" transform="rotate(-25 12 13)"/><path d="M9.3 10.3l2.2 5.6" transform="rotate(-25 12 13)"/></svg>
        Medicines
      </button>
    </div>
  </div>

  <!-- ============ DETAIL DRILL-DOWN (read-only — no edit/delete) ============ -->
  <div class="detail" id="detail">
    <div class="detail-header">
      <div class="detail-back" id="detail-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div class="detail-titles">
        <div class="cat" id="detail-cat">—</div>
        <div class="val" id="detail-val">—</div>
      </div>
    </div>
    <div class="detail-daynav">
      <button class="daynav-btn" id="detail-prev-day" aria-label="Previous day">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daynav-label" id="detail-day-label">Today</div>
      <button class="daynav-btn" id="detail-next-day" aria-label="Next day">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="daynav-btn daynav-cal" id="detail-calendar-btn" aria-label="Jump to a date">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      </button>
      <input type="date" class="daynav-date-hidden" id="detail-date-input" aria-label="Jump to date">
    </div>
    <div class="detail-body-wrap">
      <div class="detail-chart-card" id="detail-chart-card">
        <svg viewBox="0 0 300 120" preserveAspectRatio="none" id="detail-chart"></svg>
      </div>
      <p class="detail-list-title" id="detail-list-title">Today's entries</p>
      <div id="detail-entries"></div>
    </div>
  </div>

  <!-- ============ MEDICINE HISTORY (day-by-day, read-only) ============ -->
  <div class="detail" id="medicine-history">
    <div class="detail-header">
      <div class="detail-back" id="medicine-history-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div class="detail-titles">
        <div class="cat" id="medicine-history-name">—</div>
        <div class="val" id="medicine-history-dose">—</div>
      </div>
    </div>
    <div class="detail-daynav">
      <button class="daynav-btn" id="medicine-history-prev-day" aria-label="Previous day">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daynav-label" id="medicine-history-day-label">Today</div>
      <button class="daynav-btn" id="medicine-history-next-day" aria-label="Next day">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="daynav-btn daynav-cal" id="medicine-history-calendar-btn" aria-label="Jump to a date">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      </button>
      <input type="date" class="daynav-date-hidden" id="medicine-history-date-input" aria-label="Jump to date">
    </div>
    <div class="detail-body-wrap">
      <div class="trend-card" id="medicine-history-status-card" style="padding:6px 16px;"></div>
    </div>
  </div>

</div>

<script src="dashboard.js"></script>
</body>
</html>
